<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="brand-title">Flicker</h1>
      <p class="brand-subtitle">Sign in to join the conversation</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">
        {{ errorMessage() }}
      </div>
    }
    @if (successMessage()) { <div class="alert-success">{{ successMessage() }}</div> }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">Email or username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="you@example.com or dev_user"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="form-input"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading()"
        class="btn-primary"
      >
        {{ loading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a routerLink="/register" class="auth-link">Create one</a>
    </div>
  </div>
</div>
