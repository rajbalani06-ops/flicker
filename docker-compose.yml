version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flicker-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-flicker_db}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the root .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flicker-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flicker-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in the root .env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env file}
    ports:
      - "5672:5672"    # AMQP port (used by Spring Boot)
      - "15672:15672"  # Web Dashboard (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
